[project]
name = "fastapi-security-baseline"
version = "0.4.0"
description = "A secure, reusable FastAPI baseline for production-minded services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=5.0,<6.0",
  "SQLAlchemy>=2.0,<3.0",
  "cryptography>=50.0,<51.0",
  "pyotp>=2.9,<3.0",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1.0", "pytest>=9.0.3,<10.0", "pytest-cov>=6.0,<7.0", "aiosqlite>=0.20,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "B008", "E501", "UP017"]
