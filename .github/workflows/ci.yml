name: CI
on: [push, pull_request]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]' ruff pip-audit
      - run: ruff check .
      - name: Verify Redis 5 client compatibility
        run: |
          pip install 'redis>=5.0,<6.0'
          python -m pytest tests/test_refresh_store.py
          pip install 'redis>=8.0,<9.0'
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70
      - run: python -m compileall -q app tests
      - run: pip check
      - name: Audit dependencies and write SBOM
        run: pip-audit --format cyclonedx-json --output sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 14
      - name: Build container
        run: docker build --pull --tag fastapi-security-baseline:${{ github.sha }} .
      - name: Inspect container configuration
        run: |
          docker image inspect fastapi-security-baseline:${{ github.sha }} \
            --format '{{json .Config.User}} {{json .Config.Healthcheck}}'
